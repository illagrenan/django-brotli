# https://taskfile.dev

version: '3'

env:
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1

vars:
  SOURCES: ./django_brotli/ ./tests/

tasks:
  test:
    aliases:
      - tests
      - pytest
      - pytests
    desc: Run pytests
    cmds:
      - uv run pytest
    silent: false

  coverage:
    desc: Run coverage
    cmds:
      - uv run pytest --cov=./django_brotli/ --cov-branch --cov-report=xml --cov-report=term-missing ./tests/
    silent: false

  clean:
    desc: Clean build files
    cmds:
      - >
        {{if eq OS "windows"}}
        powershell -Command Remove-Item *.egg-info, dist, .tox, coverage.xml, .coverage, .mypy_cache, .pytest_cache -Recurse -Force -ErrorAction SilentlyContinue
        {{else}}
        rm -rf *egg-info dist .tox coverage.xml .coverage .mypy_cache .pytest_cache
        {{end}}
    silent: false

  mypy:
    desc: Type check with mypy and pyright
    cmds:
      - uv run mypy {{.SOURCES}}
      - uv run pyright {{.SOURCES}}
    silent: false

  ruff:
    desc: Run ruff
    cmds:
      - uv run ruff check {{.SOURCES}}
    silent: false

  lint:
    desc: Run linters and type checks
    cmds:
      - task: mypy
      - task: ruff
      - task: format_check
    silent: false

  format:
    aliases:
      - fmt
    desc: Fix lint issues and format code
    cmds:
      - uv run ruff check --fix {{.SOURCES}}
      - uv format -- {{.SOURCES}}
    silent: false

  format_check:
    desc: Check code formatting
    cmds:
      - uv format --check -- {{.SOURCES}}
    silent: false

  build:
    desc: Build the package
    cmds:
      - uv build
    silent: false

  build_check:
    desc: Check built distributions with Twine
    cmds:
      - uv run twine check dist/*
    silent: false

  test_install:
    desc: Try to install local dist
    vars:
      PROJECT_NAME: django-brotli
    deps: [ build ]
    cmds:
      - uv pip uninstall {{.PROJECT_NAME}}
      - uv pip install --no-cache-dir --no-index --find-links=file:./dist {{.PROJECT_NAME}}
      - uv pip uninstall {{.PROJECT_NAME}}
    silent: false
