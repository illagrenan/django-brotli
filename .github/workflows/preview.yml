name: "Preview"

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  publish_dev_build:
    name: Preview the package
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.15" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run linters
        run: |
          uv run task lint

      - name: Run unittests
        run: |
          uv run task coverage

      - name: Build wheels and source tarball
        run: |
          # Create dev version using sed to modify pyproject.toml
          sed -i 's/version = "\([^"]*\)"/version = "\1-dev.'$GITHUB_RUN_NUMBER'"/' pyproject.toml
          uv build

      - name: publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN}}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
