[project]
name = "django-brotli"
version = "0.5.0"
description = "Middleware that compresses response using brotli algorithm."
authors = [
    { name = "Václav Dohnal", email = "vaclav.dohnal@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["django", "brotli", "compression", "middleware"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]

dependencies = [
    "Django>=5.2",
    "brotli>=1.1",
]

[project.urls]
homepage = "https://github.com/illagrenan/django-brotli"
repository = "https://github.com/illagrenan/django-brotli"
bug-tracker = "https://github.com/illagrenan/django-brotli/issues"
changelog = "https://github.com/illagrenan/django-brotli/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    # --- Linting & type checking ---
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "pyright>=1.1.414",
    "django-stubs>=6.1.2",

    # --- Testing ---
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "faker>=40.54.0",

    # --- Releases ---
    "bump-my-version>=1.8.1",
    "twine>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**"]

[tool.pytest.ini_options]
minversion = "8.0"
norecursedirs = [".*", "build", "dist", "venv", "__pycache__"]
addopts = "--verbose --color=yes --showlocals -r A --tb=auto -s -x"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py"
]
junit_suite_name = "django-brotli"
junit_family = "xunit2"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = '%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)'
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = [
    "./tests/"
]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
]
ignore = [
    "ISC001",
    "RET504",
    "RET505",
    "S101",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TC007",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",
    "PLR2004",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
